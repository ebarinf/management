<div class="flex min-h-screen w-full font-sans bg-surface-login">
  <div class="flex flex-[1.1_1_0%] flex-col items-start justify-center bg-login-side p-20 text-white">
    <div class="mb-7 flex h-14 w-14 items-center justify-center rounded-[14px] bg-white/15">
      <span class="material-symbols-outlined text-[30px]">badge</span>
    </div>
    <h1 class="m-0 text-[34px] font-medium leading-[1.2] tracking-[-0.5px]">Gestión de Personal</h1>
    <p class="mt-3 max-w-[380px] text-base font-normal leading-normal text-white/75">
      Sistema interno de administración de personal y certificaciones profesionales.
    </p>
  </div>
  <div class="flex flex-1 items-center justify-center p-10">
    <form class="flex w-[380px] flex-col gap-2" [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="mb-1 text-[13px] font-medium uppercase tracking-[0.5px] text-ink-secondary">Acceso al sistema</div>
      <div class="mb-6 text-2xl font-medium text-ink-primary">Iniciar sesión</div>

      <label for="user" class="mb-1.5 text-xs font-medium text-[oklch(0.4_0.01_250)]">Usuario</label>
      <div class="mb-5 flex items-center gap-2.5 rounded border border-solid border-line bg-white px-3.5 py-3">
        <span class="material-symbols-outlined text-[20px] text-ink-muted">person</span>
        <input
          id="user"
          type="text"
          placeholder="nombre.apellido"
          formControlName="username"
          autocomplete="username"
          class="flex-1 border-0 bg-transparent font-sans text-[15px] text-ink-primary outline-none"
        />
      </div>

      <label for="pass" class="mb-1.5 text-xs font-medium text-[oklch(0.4_0.01_250)]">Contraseña</label>
      <div class="mb-5 flex items-center gap-2.5 rounded border border-solid border-line bg-white px-3.5 py-3">
        <span class="material-symbols-outlined text-[20px] text-ink-muted">lock</span>
        <input
          id="pass"
          type="password"
          placeholder="••••••••"
          formControlName="password"
          autocomplete="current-password"
          class="flex-1 border-0 bg-transparent font-sans text-[15px] text-ink-primary outline-none"
        />
      </div>

      @if (errorMensaje()) {
        <div class="-mt-2 mb-4 text-[13px] text-danger">{{ errorMensaje() }}</div>
      }

      <button
        class="cursor-pointer rounded-full border-0 bg-accent py-3 font-sans text-[15px] font-medium tracking-[0.2px] text-white hover:brightness-[1.08] disabled:cursor-default disabled:opacity-70"
        type="submit"
        [disabled]="enviando()"
      >
        {{ enviando() ? 'Ingresando…' : 'Ingresar' }}
      </button>

      <div class="mt-5 text-center text-xs leading-normal text-[oklch(0.6_0.01_250)]">
        Los accesos son administrados por el equipo de RRHH.<br />Contacta a soporte si olvidaste tu contraseña.
      </div>
    </form>
  </div>
</div>
